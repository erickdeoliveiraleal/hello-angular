spring.application.name=auth-server
server.port=9000

# Nome diferente do JSESSIONID do backend. Cookies não separam por porta: sem isso, a sessão do
# servidor de autorização e a do backend poderiam se sobrescrever no navegador.
server.servlet.session.cookie.name=AUTH_SERVER_SESSION

# Endereço público do servidor de autorização. Vai no "iss" dos tokens.
app.issuer=http://localhost:9000

# Cliente registrado: o backend (BFF).
app.bff.client-id=bff
# Só para desenvolvimento. Em produção, o segredo vem de variável de ambiente ou cofre de segredos.
app.bff.client-secret=${BFF_CLIENT_SECRET:bff-secret}
# Para onde o servidor de autorização devolve o usuário depois do login. O Spring Authorization Server
# não aceita "localhost" em redirect_uri (exige o IP 127.0.0.1), por isso o app roda em 127.0.0.1:4200.
app.bff.redirect-uri=http://127.0.0.1:4200/login/oauth2/code/hello
app.bff.post-logout-redirect-uri=http://127.0.0.1:4200/

# Curto de propósito, para ver o BFF renovar o access token sozinho.
app.tokens.access-token-ttl=1m
app.tokens.refresh-token-ttl=1d
