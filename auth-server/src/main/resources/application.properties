spring.application.name=auth-server
server.port=9000

# Nome próprio para o cookie de sessão do servidor de autorização (é o que mantém o usuário logado
# aqui e permite pedir tokens novos sem digitar o nome de novo).
server.servlet.session.cookie.name=AUTH_SERVER_SESSION

# Endereço público do servidor de autorização. Vai no "iss" dos tokens.
app.issuer=http://localhost:9000

# Cliente registrado: o próprio Angular (cliente público, sem segredo, com PKCE).
app.angular.client-id=angular
# Origem do Angular, liberada no CORS para chamar o /oauth2/token.
app.angular.origin=http://127.0.0.1:4200
# Para onde o servidor de autorização devolve o usuário depois do login. O Spring Authorization Server
# não aceita "localhost" em redirect_uri (exige o IP 127.0.0.1), por isso o app roda em 127.0.0.1:4200.
app.angular.redirect-uri=http://127.0.0.1:4200/
app.angular.post-logout-redirect-uri=http://127.0.0.1:4200/

# Curto de propósito, para ver o app pedir um token novo ao auth-server.
app.tokens.access-token-ttl=1m
