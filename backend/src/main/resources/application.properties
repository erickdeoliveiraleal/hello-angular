spring.application.name=backend

# Sessão do usuário (cookie JSESSIONID).
# HttpOnly: o JavaScript da página não lê o cookie.
server.servlet.session.cookie.http-only=true
# Secure: só via HTTPS (os navegadores aceitam também em http://localhost).
server.servlet.session.cookie.secure=true
# SameSite=Strict: o cookie não vai em requisições que partem de outros sites.
server.servlet.session.cookie.same-site=strict
# Sem atividade por esse tempo, a sessão expira e é preciso entrar de novo.
server.servlet.session.timeout=15m

# Tokens do app móvel (chain com Authorization: Bearer, veja MobileSecurityConfig).
# Chave HMAC (Base64, 256 bits) que assina os JWTs. O valor padrão é só para desenvolvimento:
# em produção defina a variável de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:8FF4tMpffQT9RHKcGTXT1DDSMAPkZqnkzPwzJBnFtRQ=}
app.jwt.issuer=hello-angular-backend
app.jwt.access-token-ttl=15m
