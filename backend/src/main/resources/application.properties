spring.application.name=backend

# ---------------------------------------------------------------------------------------------
# BFF: login OAuth 2 (Authorization Code) com o auth-server. Os tokens ficam na sessão do servidor;
# o navegador só recebe o cookie JSESSIONID.
# ---------------------------------------------------------------------------------------------
spring.security.oauth2.client.registration.hello.provider=hello
spring.security.oauth2.client.registration.hello.client-id=bff
spring.security.oauth2.client.registration.hello.client-secret=${BFF_CLIENT_SECRET:bff-secret}
spring.security.oauth2.client.registration.hello.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.hello.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.hello.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.hello.scope=openid,profile

# Endereços explícitos (em vez de issuer-uri) para o backend subir mesmo com o auth-server desligado.
# authorization-uri é aberto pelo navegador; os demais são chamados pelo próprio backend.
spring.security.oauth2.client.provider.hello.authorization-uri=http://localhost:9000/oauth2/authorize
spring.security.oauth2.client.provider.hello.token-uri=http://localhost:9000/oauth2/token
spring.security.oauth2.client.provider.hello.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.client.provider.hello.user-info-uri=http://localhost:9000/userinfo
spring.security.oauth2.client.provider.hello.user-name-attribute=sub

# Logout no auth-server (OpenID Connect RP-Initiated Logout).
app.auth-server.logout-uri=http://localhost:9000/connect/logout

# ---------------------------------------------------------------------------------------------
# API: aceita access tokens JWT assinados pelo auth-server (chave pública em /oauth2/jwks).
# ---------------------------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

# Onde o BFF chama a API. Aqui é o próprio backend; numa arquitetura maior, outro serviço.
app.api-base-url=http://localhost:8080

# ---------------------------------------------------------------------------------------------
# Sessão do navegador com o BFF (cookie JSESSIONID).
# ---------------------------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
# Lax (e não Strict): a volta do login é um redirecionamento vindo de outro site (localhost:9000 ->
# 127.0.0.1:4200). Com Strict, o navegador não mandaria o cookie e o BFF perderia o login em andamento.
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m
