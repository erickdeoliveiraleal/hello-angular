spring.application.name=backend

# Chave HMAC (Base64, 256 bits) usada para assinar os JWTs.
# O valor padrão é só para desenvolvimento: em produção defina a variável de ambiente JWT_SECRET.
app.jwt.secret=${JWT_SECRET:8FF4tMpffQT9RHKcGTXT1DDSMAPkZqnkzPwzJBnFtRQ=}
app.jwt.issuer=hello-angular-backend
# Curto de propósito, para dar para ver o refresh acontecer.
app.jwt.access-token-ttl=1m
# O refresh token não é JWT: é uma string aleatória guardada (como hash) no servidor.
app.jwt.refresh-token-ttl=1d
# De quanto em quanto tempo os refresh tokens expirados são apagados da memória.
app.jwt.refresh-cleanup-interval=10m
