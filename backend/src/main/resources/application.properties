spring.application.name=backend

# A API aceita access tokens JWT assinados pelo auth-server. A chave pública vem de /oauth2/jwks
# (buscada na primeira requisição, então o backend sobe mesmo com o auth-server desligado) e o
# "iss" do token precisa ser o do auth-server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
