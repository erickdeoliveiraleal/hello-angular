spring.application.name=backend

# O auth-server (Spring Authorization Server) emite os tokens. O backend é um cliente dele: troca o
# nome digitado por tokens (grant customizado), renova e revoga.
app.auth-server.url=http://localhost:9000
app.auth-server.client-id=backend
# Só para desenvolvimento. Em produção, o segredo vem de variável de ambiente ou cofre de segredos.
app.auth-server.client-secret=${BACKEND_CLIENT_SECRET:backend-secret}

# Validade do cookie com o refresh token (igual à do refresh token no auth-server).
app.refresh-cookie-max-age=1d

# A API aceita access tokens JWT assinados pelo auth-server (chave pública em /oauth2/jwks).
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
