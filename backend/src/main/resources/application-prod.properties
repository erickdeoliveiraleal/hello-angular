# Perfil de produção. Ativado com:
#   java -jar backend.jar --spring.profiles.active=prod
# As linhas daqui se somam às de application.properties (e têm prioridade).
#
# Cenário: um servidor web (nginx, Apache, IIS) na mesma máquina atende HTTPS na porta 443
# e repassa tudo para o Spring em http://127.0.0.1:8080. O Spring nunca fica exposto.

# Só aceita conexões da própria máquina, ou seja, do proxy. Ninguém de fora fala direto
# com o Spring. (Para expor o Spring sem proxy, tire esta linha e configure HTTPS no
# próprio Spring com server.ssl.*.)
server.address=127.0.0.1

# O proxy avisa, nos cabeçalhos X-Forwarded-*, que o acesso original foi por HTTPS e qual
# era o endereço. Com isto o Spring passa a enxergar a requisição como HTTPS
# (request.isSecure() = true). Só é seguro porque, pela linha acima, só o proxy chega aqui.
server.forward-headers-strategy=framework

# Cookie de sessão (JSESSIONID):
# - secure: o navegador só envia o cookie por HTTPS, nunca por HTTP sem criptografia;
# - same-site=lax: o navegador não envia o cookie em POSTs vindos de outros sites
#   (uma segunda barreira contra CSRF, além do token XSRF-TOKEN).
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Sessão expira após 30 minutos sem uso (é o padrão; fica explícito para quem lê).
server.servlet.session.timeout=30m
