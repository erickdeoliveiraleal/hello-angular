<h1>{{ greeting() }}</h1>
<p>{{ title() }} rodando com Angular {{ version }}</p>

<form (submit)="$event.preventDefault(); greet()">
  <label for="name">Seu nome</label>
  <input
    id="name"
    type="text"
    placeholder="Digite seu nome"
    [value]="name()"
    (input)="name.set($any($event.target).value)"
  />
  <button type="submit">Cumprimentar</button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

@if (auth.user(); as user) {
  <p class="status">
    Autenticado como <strong>{{ user }}</strong> via sessão (JSESSIONID)
    <button type="button" (click)="logout()">Sair</button>
  </p>
}

<router-outlet />
